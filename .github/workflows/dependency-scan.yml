name: Dependency risk scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SupplyChainX
        run: pip install -r requirements.txt

      - name: Scan dependencies
        run: python src/cli.py . --config config/policy.json

      - name: Upload SBOM + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-risk-report
          path: |
            sbom.json
            report.json
