name: Dependency risk scan

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the repo and uploads an
# artifact - it never needs to write to the repo, comment on PRs, etc.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a full commit SHA rather than a movable tag
      # (@v4) - a tag can be re-pointed if the action's maintainer
      # account is compromised, a full SHA can't be. The `# vX.Y`
      # comment is just for humans; Dependabot understands this format
      # and can still open PRs to bump the pinned SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install SupplyChainX
        run: pip install -r requirements.txt

      - name: Scan dependencies
        run: python src/cli.py . --config config/policy.json

      - name: Upload SBOM + report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-risk-report
          path: |
            sbom.json
            report.json
